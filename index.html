<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Catálogo Mamãe Açúcar</title>
        <link rel="shortcut icon" href="images/bolinho.png" type="image/x-icon" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header>
            <h1>🧁 Mamãe Açúcar 🧁</h1>
            <p>Feito com amor e ingredientes selecionados</p>
        </header>

        <!-- Filtros -->
        <div class="filters">
            <button class="filter-btn active" onclick="filterProducts('todos', this)">Todos</button>
            <button class="filter-btn" onclick="filterProducts('bolos', this)">Bolos</button>
            <button class="filter-btn" onclick="filterProducts('doces', this)">Doces</button>
            <button class="filter-btn" onclick="filterProducts('salgados', this)">Salgados</button>
            <button class="filter-btn builder-btn" onclick="openBuilder()">🎂 Monte seu bolo</button>
        </div>

        <!-- Lista de Produtos -->
        <main class="catalog-container" id="catalog">
            <!-- Os produtos serão inseridos aqui via JavaScript -->
        </main>

        <!-- Barra Inferior do Carrinho -->
        <div class="cart-bar">
            <div class="cart-summary"><span id="cart-count">0 itens</span> | <span id="cart-total">R$ 0,00</span></div>
            <button class="checkout-btn" id="open-cart-btn" onclick="openModal()" disabled>Ver Pedido</button>
        </div>

        <!-- Modal de Revisão do Pedido -->
        <div class="modal" id="cart-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Seu Pedido</h2>
                    <button class="close-btn" onclick="closeModal()">&times;</button>
                </div>
                <div id="cart-items-list"></div>
                <div style="margin-top: 1.5rem; text-align: right; font-weight: bold; font-size: 1.1rem">
                    Total: <span id="modal-total">R$ 0,00</span>
                </div>
                <button
                    class="checkout-btn"
                    style="width: 100%; justify-content: center; margin-top: 1rem"
                    onclick="sendWhatsApp()"
                >
                    Enviar Pedido no WhatsApp
                </button>
            </div>
        </div>
        <!-- Modal: Monte seu bolo -->
        <div class="modal" id="builder-modal" onclick="if (event.target === this) closeBuilder();">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>🎂 Monte seu bolo</h2>
                    <button class="close-btn" onclick="closeBuilder()">&times;</button>
                </div>

                <h3 class="builder-step">1. Escolha a massa</h3>
                <div id="builder-massas" class="option-list"></div>

                <h3 class="builder-step">2. Escolha os recheios <small id="builder-limit"></small></h3>
                <div id="builder-recheios" class="option-list"></div>

                <h3 class="builder-step">3. Quantas fatias?</h3>
                <div class="slices-control">
                    <button onclick="changeSlices(-1)">-</button>
                    <span id="builder-slices">1</span>
                    <button onclick="changeSlices(1)">+</button>
                </div>

                <div class="builder-total">Total: <span id="builder-price">R$ 0,00</span></div>
                <button class="checkout-btn builder-add" id="builder-add-btn" onclick="addCustomCake()" disabled>
                    Adicionar ao pedido
                </button>

                <h3 class="builder-step">1. Escolha a massa</h3>
                <div id="builder-massas" class="option-list"></div>

                <h3 class="builder-step">2. Escolha os recheios <small id="builder-limit"></small></h3>
                <div id="builder-recheios" class="option-list"></div>

                <div class="builder-total">Total: <span id="builder-price">R$ 0,00</span></div>
                <button class="checkout-btn builder-add" id="builder-add-btn" onclick="addCustomCake()" disabled>
                    Adicionar ao pedido
                </button>
            </div>
        </div>
        <script src="products.js"></script>
        <script src="recheios.js"></script>
        <script src="script.js"></script>
    </body>
</html>
